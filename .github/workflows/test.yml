name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        torch-version: ["2.0.*", latest]
        exclude:
          # PyTorch 2.0 does not publish Python 3.12 wheels.
          - python-version: "3.12"
            torch-version: "2.0.*"
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch
        run: |
          if [ "${{ matrix.torch-version }}" = "latest" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          else
            python -m pip install "torch==${{ matrix.torch-version }}" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          fi
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Test with coverage
        run: pytest --cov=zeta_scaling_toolkit --cov-report=xml --cov-report=term-missing --cov-fail-under=95 --hypothesis-seed=20261115

  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and development tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check zeta_scaling_toolkit tests benchmarks
      - name: Mypy
        run: mypy --strict zeta_scaling_toolkit

  nightly-hypothesis:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -e ".[dev]"
      - name: Run nightly property suite
        run: pytest --cov=zeta_scaling_toolkit --cov-report=term-missing --cov-fail-under=95 --hypothesis-seed=20261115

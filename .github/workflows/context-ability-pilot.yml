name: Context ability runner pilot

on:
  push:
    branches:
      - copilot/context-ability-parallel-20261116

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          python -m pip install --no-deps -e .
      - name: Exercise one-step retrieval runner
        run: |
          mkdir -p pilot
          lscpu > pilot/cpu.txt
          python benchmarks/context_ability.py --steps 1 --train-length 256 --batch-size 16 --eval-queries 200 --seeds "${{ matrix.seed }}" --output "pilot/seed-${{ matrix.seed }}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: context-pilot-${{ matrix.seed }}
          path: pilot/
          if-no-files-found: error

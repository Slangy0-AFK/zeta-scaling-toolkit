name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Git tag to publish (e.g., v0.5.0)'
        required: false
        default: ''

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          skip-existing: false

      - name: Verify published package
        run: |
          echo "Waiting for PyPI to index the package..."
          sleep 10
          pip install --upgrade zeta-scaling-toolkit==$(grep version pyproject.toml | head -1 | grep -oP '\d+\.\d+\.\d+')
          python -c "import zeta_scaling_toolkit; print(f'Package installed successfully')"

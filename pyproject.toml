[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeta-scaling-toolkit"
version = "0.5.1"
description = "Experimental PyTorch scaling utilities"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Zeta Scaling Toolkit Contributors"}
]
keywords = [
    "machine-learning",
    "deep-learning",
    "transformers",
    "attention",
    "scaling",
    "pytorch",
    "numerical-stability"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "torch>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.100.0",
    "numpy>=1.23.0,<2.0; python_version < '3.13'",
    "numpy>=2.0.0; python_version >= '3.13'",
    "safetensors>=0.4.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.100.0",
    "numpy>=1.23.0,<2.0; python_version < '3.13'",
    "numpy>=2.0.0; python_version >= '3.13'",
    "safetensors>=0.4.0"
]

[project.urls]
Homepage = "https://github.com/Slangy0-AFK/zeta-scaling-toolkit"
Documentation = "https://github.com/Slangy0-AFK/zeta-scaling-toolkit#readme"
Repository = "https://github.com/Slangy0-AFK/zeta-scaling-toolkit.git"
"Bug Tracker" = "https://github.com/Slangy0-AFK/zeta-scaling-toolkit/issues"

[tool.setuptools]
packages = ["zeta_scaling_toolkit"]

[tool.setuptools.package-data]
zeta_scaling_toolkit = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "N802", "N803", "N806", "N812"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["zeta_scaling_toolkit"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --strict-config --strict-markers"
filterwarnings = [
    "error",
    "ignore:Failed to initialize NumPy:UserWarning",
]
markers = [
    "cuda: requires a CUDA device",
]
